name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, mbstring, sqlite3, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Lint every PHP file
        run: find modules tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Check the coding standard
        run: vendor/bin/phpcs

      - name: Run static analysis
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Run the unit tests
        run: vendor/bin/phpunit

      # The SDK is meant to become a standalone package, so it must not depend on WHMCS.
      - name: Keep the SDK free of WHMCS references
        run: |
          if grep -rnE 'WHMCS\\|Whmcs\\|Capsule|localAPI|logModuleCall|encrypt\(|decrypt\(' \
            modules/servers/signnet/lib/ResellerApi; then
            echo "::error::modules/servers/signnet/lib/ResellerApi must not reference WHMCS."
            exit 1
          fi

  keys:
    name: No Sign.net API keys
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code and its history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # A key stays public once pushed, even after a later commit removes it, so the commits being added
      # are scanned as well as the files. Each key found is its own record, so a test key cannot hide a
      # real one on the same line. CI logs are public too: a key is reported by where it is, never shown.
      - name: Keep real Sign.net API keys out of the files and the commits being added
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          key='snk_(live|test)_[0-9a-f]{32}_[A-Za-z0-9]+'
          test_key=':snk_(live|test)_0123456789abcdef0123456789abcdef_[A-Za-z0-9]+$'
          none=0000000000000000000000000000000000000000

          # Adds where each real key is, [<commit>:]<file>:<line>, to the file $1, scanning the
          # revisions after it, or the checked-out files when none is given.
          scan() {
            out=$1
            shift
            status=0
            git grep -noIE "$key" "$@" -- > "$RUNNER_TEMP/matches" || status=$?
            if [ "$status" -gt 1 ]; then
              echo "::error::git grep could not scan ${*:-the files}."
              exit 1
            fi
            grep -vE "$test_key" "$RUNNER_TEMP/matches" | sed -E 's/:[^:]*$//' >> "$out" || true
          }

          : > "$RUNNER_TEMP/files"
          : > "$RUNNER_TEMP/commits"
          scan "$RUNNER_TEMP/files"

          case "$EVENT" in
            pull_request) base=$PR_BASE head=$PR_HEAD ;;
            push) base=$PUSH_BEFORE head=$PUSH_AFTER ;;
            *) base='' head='' ;;
          esac
          if [ -n "$head" ] && [ "$head" != "$none" ]; then
            if [ -n "$base" ] && [ "$base" != "$none" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
              commits=$(git rev-list "$base..$head")
            else
              # A new branch, or a base this checkout lacks: every commit the head holds.
              commits=$(git rev-list "$head")
            fi
            for commit in $commits; do
              scan "$RUNNER_TEMP/commits" "$commit"
            done
          fi

          if [ -s "$RUNNER_TEMP/files" ] || [ -s "$RUNNER_TEMP/commits" ]; then
            if [ -s "$RUNNER_TEMP/files" ]; then
              echo "In the files, by file:line:"
              cat "$RUNNER_TEMP/files"
            fi
            if [ -s "$RUNNER_TEMP/commits" ]; then
              echo "In the commits being added, by commit:file:line:"
              cat "$RUNNER_TEMP/commits"
            fi
            echo "::error::A Sign.net API key is committed where listed above. Revoke it in the reseller console:" \
              "removing it does not take it out of the history."
            exit 1
          fi
